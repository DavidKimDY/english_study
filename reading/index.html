<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f6f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="english study" />
  <title>영어 읽기 · english study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,650&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Layout: one column of article cards; same tokens as the reader so both themes match. */
    :root {
      --paper: #f3f6f4;
      --surface: #ffffff;
      --ink: #1c2430;
      --muted: #5a6778;
      --line: rgba(28, 36, 48, 0.12);
      --accent: #0f6e5c;
      --on-accent: #ffffff;
      --accent-soft: rgba(15, 110, 92, 0.12);
      --font-read: "Fraunces", "Iowan Old Style", Georgia, serif;
      --font-ui: "Sora", system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --paper: #0f1614;
        --surface: #18221f;
        --ink: #e4ebe8;
        --muted: #93a39d;
        --line: rgba(228, 235, 232, 0.12);
        --accent: #5cc8ae;
        --on-accent: #0b1512;
        --accent-soft: rgba(92, 200, 174, 0.14);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #0f1614;
      --surface: #18221f;
      --ink: #e4ebe8;
      --muted: #93a39d;
      --line: rgba(228, 235, 232, 0.12);
      --accent: #5cc8ae;
      --on-accent: #0b1512;
      --accent-soft: rgba(92, 200, 174, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      padding: calc(0.5rem + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }
    a { color: inherit; text-decoration: none; touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

    main { max-width: 640px; margin: 0 auto; }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 0.5rem;
      margin-left: -0.5rem;
      border-radius: 0.75rem;
      font-family: var(--font-read);
      font-weight: 650;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .back:active { background: var(--accent-soft); }

    h1 {
      font-family: var(--font-read);
      font-weight: 650;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.5rem; }

    .list { display: flex; flex-direction: column; gap: 0.75rem; }

    .item {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 1.1rem 1.2rem 1rem;
      border-radius: 1.1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      transition: transform 0.15s ease;
    }
    .item:active { transform: scale(0.98); }
    .eyebrow {
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .title {
      font-family: var(--font-read);
      font-weight: 650;
      font-size: 1.22rem;
      line-height: 1.3;
      text-wrap: balance;
    }
    .summary {
      font-family: var(--font-read);
      font-style: italic;
      font-size: 0.98rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.3rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .badge {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .go { color: var(--accent); font-weight: 600; }

    .status { color: var(--muted); text-align: center; padding: 2rem 0; line-height: 1.6; }

    @media (prefers-reduced-motion: reduce) { .item { transition: none; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← english study</a>
    <h1>영어 읽기</h1>
    <p class="sub">읽을 글을 고르세요.</p>
    <div class="list" id="list">
      <p class="status">불러오는 중…</p>
    </div>
  </main>

  <script>
    const list = document.getElementById("list");
    const esc = (str) => String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    function savedCounts() {
      const counts = {};
      try {
        (JSON.parse(localStorage.getItem("reading-saved-v1")) || []).forEach((x) => {
          counts[x.article] = (counts[x.article] || 0) + 1;
        });
      } catch (e) {}
      return counts;
    }

    async function load() {
      try {
        const res = await fetch("../articles/index.json", { cache: "no-store" });
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        const articles = Array.isArray(data.articles) ? data.articles : [];
        if (!articles.length) {
          list.innerHTML = '<p class="status">아직 등록된 글이 없어요.</p>';
          return;
        }
        const counts = savedCounts();
        list.innerHTML = articles.map((a) => `
          <a class="item" href="./read.html?id=${encodeURIComponent(a.id)}">
            <span class="eyebrow">${esc(a.eyebrow || "")}</span>
            <span class="title">${esc(a.title)}</span>
            ${a.summary ? `<span class="summary">“${esc(a.summary)}”</span>` : ""}
            <span class="foot">
              ${counts[a.id] ? `<span class="badge">저장 ${counts[a.id]}개</span>` : "<span></span>"}
              <span class="go">읽기 →</span>
            </span>
          </a>`).join("");
      } catch (err) {
        list.innerHTML = '<p class="status">글 목록을 불러오지 못했어요.<br>GitHub Pages에서 열어 주세요.</p>';
        console.error(err);
      }
    }

    load();
    window.addEventListener("pageshow", (e) => { if (e.persisted) load(); });
  </script>
</body>
</html>
