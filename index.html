<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>english study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5a6778;
      --line: rgba(28, 36, 48, 0.1);
      --paper: #f3f6f4;
      --wash: #d9e6e1;
      --accent: #0f6e5c;
      --skeleton: #d2ddd8;
      --skeleton-shine: #e8efeb;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Sora", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 10% -10%, #e7f1ec 0%, transparent 55%),
        radial-gradient(90% 70% at 100% 0%, #dce8f2 0%, transparent 50%),
        linear-gradient(165deg, #eef3f0 0%, var(--paper) 48%, var(--wash) 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      touch-action: pan-y;
    }

    header {
      flex: 0 0 auto;
      padding: 1.1rem 1.25rem 0.4rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .brand {
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .counter {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    main {
      flex: 1;
      display: flex;
      align-items: stretch;
      position: relative;
      padding: 0.5rem 1rem calc(1.5rem + var(--safe-bottom));
      overflow: hidden;
    }

    .deck {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      position: relative;
      display: flex;
    }

    .card {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.6rem 1.35rem 1.4rem;
      border-radius: 1.35rem;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(28, 36, 48, 0.08);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    .card.dragging {
      transition: none;
    }

    .card.exit-left {
      transform: translateX(-28%) rotate(-3deg);
      opacity: 0;
    }

    .card.exit-right {
      transform: translateX(28%) rotate(3deg);
      opacity: 0;
    }

    .card.enter {
      animation: enter-card 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes enter-card {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    .type-chip {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .query {
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: clamp(1.55rem, 5.5vw, 2rem);
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }

    .slots {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      flex: 1;
    }

    .slot {
      min-height: 3.4rem;
      position: relative;
    }

    .slot-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .slot.revealed .slot-label {
      opacity: 1;
      transform: none;
    }

    .skeleton {
      height: 3.1rem;
      border-radius: 0.7rem;
      background: linear-gradient(
        100deg,
        var(--skeleton) 30%,
        var(--skeleton-shine) 50%,
        var(--skeleton) 70%
      );
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    .skeleton.tall { height: 4.2rem; }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .slot-body {
      font-size: 0.98rem;
      line-height: 1.55;
      color: var(--ink);
      opacity: 0;
      transform: translateY(10px);
      max-height: 0;
      overflow: hidden;
      transition:
        opacity 0.35s ease,
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        max-height 0.35s ease;
    }

    .slot.revealed .skeleton {
      display: none;
    }

    .slot.revealed .slot-body {
      opacity: 1;
      transform: none;
      max-height: 12rem;
    }

    .hint {
      margin-top: auto;
      padding-top: 1rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      transition: opacity 0.25s ease;
    }

    .hint.done { opacity: 0.45; }

    .status {
      align-self: center;
      color: var(--muted);
      font-size: 0.95rem;
      padding: 2rem;
      text-align: center;
    }

    @media (min-width: 640px) {
      .card { padding: 2rem 1.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">english study</div>
    <div class="counter" id="counter">– / –</div>
  </header>
  <main>
    <div class="deck" id="deck">
      <p class="status" id="status">불러오는 중…</p>
    </div>
  </main>

  <script>
    const REVEAL_ORDER = [
      { key: "example_en", label: "example", tall: true },
      { key: "meaning", label: "meaning", tall: false },
      { key: "example_ko", label: "example ko", tall: true },
    ];

    let entries = [];
    let index = 0;
    let stage = 0; // how many slots revealed
    let pointerStartX = null;
    let dragging = false;
    let didSwipe = false;

    const deck = document.getElementById("deck");
    const counter = document.getElementById("counter");

    async function load() {
      try {
        const res = await fetch("./entries.json", { cache: "no-store" });
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        entries = Array.isArray(data.entries) ? data.entries : [];
        if (!entries.length) {
          deck.innerHTML = '<p class="status">entries가 비어 있어요.</p>';
          return;
        }
        renderCard({ animate: true });
      } catch (err) {
        deck.innerHTML = '<p class="status">entries.json을 불러오지 못했어요.<br>GitHub Pages에서 열어 주세요.</p>';
        console.error(err);
      }
    }

    function hintText() {
      if (stage === 0) return "탭해서 예문 보기 · 스와이프로 넘기기";
      if (stage === 1) return "탭해서 뜻 보기";
      if (stage === 2) return "탭해서 한국어 예문 보기";
      return "좌우로 스와이프해 다음 카드로";
    }

    function renderCard({ animate = false, exitDir = null } = {}) {
      const entry = entries[index];
      counter.textContent = `${index + 1} / ${entries.length}`;

      const build = () => {
        const slotsHtml = REVEAL_ORDER.map((slot, i) => {
          const revealed = i < stage;
          const value = entry[slot.key] || "";
          return `
            <div class="slot ${revealed ? "revealed" : ""}" data-slot="${i}">
              <div class="slot-label">${slot.label}</div>
              <div class="skeleton ${slot.tall ? "tall" : ""}" aria-hidden="true"></div>
              <div class="slot-body">${escapeHtml(value)}</div>
            </div>
          `;
        }).join("");

        deck.innerHTML = `
          <article class="card ${animate ? "enter" : ""}" id="card" role="button" tabindex="0" aria-label="탭하여 다음 내용 공개">
            <div class="type-chip">${escapeHtml(entry.type || "")}</div>
            <h1 class="query">${escapeHtml(entry.query || "")}</h1>
            <div class="slots">${slotsHtml}</div>
            <p class="hint ${stage >= REVEAL_ORDER.length ? "done" : ""}" id="hint">${hintText()}</p>
          </article>
        `;
        bindCard(document.getElementById("card"));
      };

      if (exitDir) {
        const old = document.getElementById("card");
        if (old) {
          old.classList.add(exitDir === "left" ? "exit-left" : "exit-right");
          setTimeout(build, 220);
          return;
        }
      }
      build();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function revealNext() {
      if (stage >= REVEAL_ORDER.length) return;
      stage += 1;
      const slots = document.querySelectorAll(".slot");
      const target = slots[stage - 1];
      if (target) target.classList.add("revealed");
      const hint = document.getElementById("hint");
      if (hint) {
        hint.textContent = hintText();
        hint.classList.toggle("done", stage >= REVEAL_ORDER.length);
      }
    }

    function go(delta, exitDir) {
      const next = index + delta;
      if (next < 0 || next >= entries.length) {
        const card = document.getElementById("card");
        if (card) {
          card.style.transform = "translateX(0)";
          card.classList.remove("dragging");
        }
        return;
      }
      index = next;
      stage = 0;
      renderCard({ animate: true, exitDir });
    }

    function bindCard(card) {
      card.addEventListener("click", (e) => {
        if (didSwipe) {
          didSwipe = false;
          return;
        }
        revealNext();
      });

      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          revealNext();
        } else if (e.key === "ArrowLeft") {
          go(1, "left");
        } else if (e.key === "ArrowRight") {
          go(-1, "right");
        }
      });

      const onDown = (x) => {
        pointerStartX = x;
        dragging = true;
        didSwipe = false;
        card.classList.add("dragging");
      };

      const onMove = (x) => {
        if (!dragging || pointerStartX == null) return;
        const dx = x - pointerStartX;
        card.style.transform = `translateX(${dx}px) rotate(${dx * 0.03}deg)`;
        if (Math.abs(dx) > 12) didSwipe = true;
      };

      const onUp = (x) => {
        if (!dragging || pointerStartX == null) return;
        const dx = x - pointerStartX;
        dragging = false;
        pointerStartX = null;
        card.classList.remove("dragging");

        if (dx <= -72) {
          go(1, "left");
        } else if (dx >= 72) {
          go(-1, "right");
        } else {
          card.style.transform = "";
        }
      };

      card.addEventListener("touchstart", (e) => onDown(e.touches[0].clientX), { passive: true });
      card.addEventListener("touchmove", (e) => onMove(e.touches[0].clientX), { passive: true });
      card.addEventListener("touchend", (e) => onUp(e.changedTouches[0].clientX));

      card.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch") return;
        onDown(e.clientX);
        card.setPointerCapture(e.pointerId);
      });
      card.addEventListener("pointermove", (e) => {
        if (e.pointerType === "touch") return;
        onMove(e.clientX);
      });
      card.addEventListener("pointerup", (e) => {
        if (e.pointerType === "touch") return;
        onUp(e.clientX);
      });
      card.addEventListener("pointercancel", () => {
        dragging = false;
        pointerStartX = null;
        card.classList.remove("dragging");
        card.style.transform = "";
      });
    }

    load();
  </script>
</body>
</html>
