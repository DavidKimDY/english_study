<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef3f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="english study" />
  <title>english study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5a6778;
      --paper: #f3f6f4;
      --wash: #d9e6e1;
      --accent: #0f6e5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "Sora", system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-text-size-adjust: 100%;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(120% 80% at 10% -10%, #e7f1ec 0%, transparent 55%),
        radial-gradient(90% 70% at 100% 0%, #dce8f2 0%, transparent 50%),
        linear-gradient(165deg, #eef3f0 0%, var(--paper) 48%, var(--wash) 100%);
      background-attachment: fixed;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(2rem + env(safe-area-inset-top, 0px)) 1.25rem calc(2.5rem + env(safe-area-inset-bottom, 0px));
      justify-content: flex-end;
    }

    main {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    h1 {
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .menu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 64px;
      padding: 1rem 1.35rem;
      touch-action: manipulation;
      border-radius: 1.1rem;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(28, 36, 48, 0.07);
      color: inherit;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @media (hover: hover) { a.menu:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(28, 36, 48, 0.1); } }
    a.menu:active { transform: scale(0.98); }
    a.menu .arrow { color: var(--accent); }

    .menu.soon {
      color: var(--muted);
      cursor: default;
      opacity: 0.7;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>english study</h1>
    <p class="sub">오늘은 어떤 방법으로 공부할까요?</p>
    <nav>
      <a class="menu" href="./unknown/">몰랐던 영어 <span class="arrow">→</span></a>
      <a class="menu" href="./reading/">영어 읽기 <span class="arrow">→</span></a>
      <div class="menu soon" aria-disabled="true">영어 외우기 <span class="tag">제작 예정</span></div>
    </nav>
  </main>
</body>
</html>
