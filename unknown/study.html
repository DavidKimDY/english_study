<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef3f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="english study" />
  <title>몰랐던 영어 · english study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5a6778;
      --line: rgba(28, 36, 48, 0.1);
      --paper: #f3f6f4;
      --wash: #d9e6e1;
      --accent: #0f6e5c;
      --accent-soft: rgba(15, 110, 92, 0.12);
      --skeleton: #d2ddd8;
      --skeleton-shine: #e8efeb;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: "Sora", system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      background:
        radial-gradient(120% 80% at 10% -10%, #e7f1ec 0%, transparent 55%),
        radial-gradient(90% 70% at 100% 0%, #dce8f2 0%, transparent 50%),
        linear-gradient(165deg, #eef3f0 0%, var(--paper) 48%, var(--wash) 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    button, a { touch-action: manipulation; }

    /* ---------- top ---------- */
    header {
      flex: 0 0 auto;
      padding: calc(0.5rem + var(--safe-top)) 0.75rem 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 0.5rem;
      margin-left: -0.25rem;
      font-family: "Fraunces", system-ui, sans-serif;
      font-weight: 650;
      font-size: 1rem;
      letter-spacing: -0.02em;
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
      border-radius: 0.75rem;
    }

    .back:active { background: var(--accent-soft); }

    .mode {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--line);
      flex-shrink: 0;
    }

    .mode button {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 36px;
      padding: 0 0.85rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .mode button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
    }

    .progress {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.35rem 1.25rem 0.5rem;
    }

    .bar {
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    .counter {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      min-width: 3.2rem;
      text-align: right;
    }

    /* ---------- card ---------- */
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 0.25rem 1rem 0.75rem;
    }

    .deck {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      min-height: 0;
    }

    .card {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.5rem 1.35rem;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(28, 36, 48, 0.08);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      outline: none;
      cursor: pointer;
    }

    .card.dragging { transition: none; }
    .card.exit-left { transform: translateX(-28%) rotate(-3deg); opacity: 0; }
    .card.exit-right { transform: translateX(28%) rotate(3deg); opacity: 0; }
    .card.enter { animation: enter-card 0.38s cubic-bezier(0.22, 1, 0.36, 1) both; }

    @keyframes enter-card {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    .type-chip {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }

    .query {
      font-family: "Fraunces", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      font-weight: 650;
      font-size: clamp(1.6rem, 7vw, 2.1rem);
      line-height: 1.25;
      letter-spacing: -0.03em;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .slots {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .slot-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .skeleton {
      height: 3.1rem;
      border-radius: 0.75rem;
      background: linear-gradient(100deg, var(--skeleton) 30%, var(--skeleton-shine) 50%, var(--skeleton) 70%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    .skeleton.tall { height: 4.4rem; }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .slot-body {
      display: none;
      font-size: 1.05rem;
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .slot.revealed .slot-label { opacity: 1; }
    .slot.revealed .skeleton { display: none; }
    .slot.revealed .slot-body {
      display: block;
      animation: reveal 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .status {
      align-self: center;
      width: 100%;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      padding: 2rem;
      text-align: center;
    }

    /* ---------- finish ---------- */
    .finish {
      width: 100%;
      align-self: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }

    .finish h2 {
      font-family: "Fraunces", system-ui, sans-serif;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .finish p { color: var(--muted); margin-bottom: 1.5rem; }

    /* ---------- bottom controls ---------- */
    .controls {
      flex: 0 0 auto;
      display: flex;
      gap: 0.6rem;
      width: 100%;
      max-width: 512px;
      margin: 0 auto;
      padding: 0 1rem calc(0.75rem + var(--safe-bottom));
    }

    .controls button, .finish button, .finish a {
      font: inherit;
      min-height: 56px;
      border-radius: 1.1rem;
      border: 1px solid var(--line);
      cursor: pointer;
    }

    .nav-btn {
      flex: 0 0 56px;
      background: rgba(255, 255, 255, 0.75);
      color: var(--ink);
      font-size: 1.3rem !important;
    }

    .nav-btn:disabled { opacity: 0.35; cursor: default; }

    .primary {
      flex: 1;
      background: var(--accent);
      border-color: var(--accent) !important;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      padding: 0 1rem;
    }

    .controls button:active:not(:disabled),
    .finish button:active, .finish a:active { transform: scale(0.97); }

    .finish .row { display: flex; flex-direction: column; gap: 0.6rem; }
    .finish a {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.75);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }

    .swipe-tip {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      padding-bottom: 0.4rem;
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="./" id="back">← 몰랐던 영어</a>
    <div class="mode" role="group" aria-label="먼저 보일 언어">
      <button type="button" data-mode="en" aria-pressed="true">EN 먼저</button>
      <button type="button" data-mode="ko" aria-pressed="false">KO 먼저</button>
    </div>
  </header>

  <div class="progress">
    <div class="bar"><span id="bar"></span></div>
    <div class="counter" id="counter">– / –</div>
  </div>

  <main>
    <div class="deck" id="deck">
      <p class="status">불러오는 중…</p>
    </div>
  </main>

  <p class="swipe-tip" id="swipeTip">카드를 탭하거나 좌우로 밀어 보세요</p>
  <div class="controls" id="controls">
    <button type="button" class="nav-btn" id="prevBtn" aria-label="이전 카드">‹</button>
    <button type="button" class="primary" id="primaryBtn">다음 보기</button>
    <button type="button" class="nav-btn" id="nextBtn" aria-label="다음 카드">›</button>
  </div>

  <script>
    const MODES = {
      en: {
        front: "query",
        reveal: [
          { key: "example_en", label: "example", tall: true, hint: "예문" },
          { key: "meaning", label: "meaning", tall: false, hint: "뜻" },
          { key: "example_ko", label: "example ko", tall: true, hint: "한국어 예문" },
        ],
      },
      ko: {
        front: "meaning",
        reveal: [
          { key: "example_ko", label: "example ko", tall: true, hint: "한국어 예문" },
          { key: "query", label: "english", tall: false, hint: "영어 표현" },
          { key: "example_en", label: "example", tall: true, hint: "영어 예문" },
        ],
      },
    };

    let entries = [];
    let index = 0;
    let stage = 0;
    let finished = false;
    let mode = "en";
    try { if (localStorage.getItem("unknown-mode") === "ko") mode = "ko"; } catch (e) {}
    let REVEAL_ORDER = MODES[mode].reveal;

    const deck = document.getElementById("deck");
    const counter = document.getElementById("counter");
    const bar = document.getElementById("bar");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const primaryBtn = document.getElementById("primaryBtn");
    const controls = document.getElementById("controls");
    const swipeTip = document.getElementById("swipeTip");

    try { if (localStorage.getItem("unknown-swiped")) swipeTip.hidden = true; } catch (e) {}

    /* ---------- mode ---------- */
    function syncModeButtons() {
      document.querySelectorAll(".mode button").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
      });
    }

    function setMode(next) {
      if (!MODES[next] || next === mode) return;
      mode = next;
      REVEAL_ORDER = MODES[mode].reveal;
      try { localStorage.setItem("unknown-mode", mode); } catch (e) {}
      syncModeButtons();
      if (entries.length && !finished) {
        stage = 0;
        renderCard({ animate: true });
      }
    }

    document.querySelectorAll(".mode button").forEach((b) => {
      b.addEventListener("click", () => setMode(b.dataset.mode));
    });
    syncModeButtons();

    /* ---------- load ---------- */
    async function load() {
      const date = new URLSearchParams(location.search).get("date");
      const isDate = /^\d{4}-\d{2}-\d{2}$/.test(date || "");
      document.getElementById("back").textContent = "← " + (isDate ? formatDate(date) : "전체");
      const src = isDate ? `../entries/${date}.json` : "../entries.json";
      try {
        const res = await fetch(src, { cache: "no-store" });
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        entries = Array.isArray(data.entries) ? data.entries : [];
        if (!entries.length) {
          showStatus("이 날짜에는 단어가 없어요.");
          return;
        }
        renderCard({ animate: true });
      } catch (err) {
        showStatus("단어 파일을 불러오지 못했어요.<br>GitHub Pages에서 열어 주세요.");
        console.error(err);
      }
    }

    function formatDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return `${m}월 ${d}일`;
    }

    function showStatus(html) {
      deck.innerHTML = `<p class="status">${html}</p>`;
      controls.hidden = true;
      swipeTip.hidden = true;
    }

    /* ---------- render ---------- */
    function primaryLabel() {
      if (stage < REVEAL_ORDER.length) return `${REVEAL_ORDER[stage].hint} 보기`;
      return index < entries.length - 1 ? "다음 카드 →" : "완료";
    }

    function syncControls() {
      counter.textContent = `${index + 1} / ${entries.length}`;
      bar.style.width = `${((index + (stage >= REVEAL_ORDER.length ? 1 : 0)) / entries.length) * 100}%`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index >= entries.length - 1;
      primaryBtn.textContent = primaryLabel();
    }

    function renderCard({ animate = false, exitDir = null } = {}) {
      finished = false;
      controls.hidden = false;
      const entry = entries[index];

      const build = () => {
        const slotsHtml = REVEAL_ORDER.map((slot, i) => `
          <div class="slot ${i < stage ? "revealed" : ""}">
            <div class="slot-label">${slot.label}</div>
            <div class="skeleton ${slot.tall ? "tall" : ""}" aria-hidden="true"></div>
            <div class="slot-body">${escapeHtml(entry[slot.key] || "")}</div>
          </div>`).join("");

        deck.innerHTML = `
          <article class="card ${animate ? "enter" : ""}" id="card" aria-live="polite">
            <div class="type-chip">${escapeHtml(entry.type || "")}</div>
            <h1 class="query">${escapeHtml(entry[MODES[mode].front] || "")}</h1>
            <div class="slots">${slotsHtml}</div>
          </article>`;
        bindCard(document.getElementById("card"));
        syncControls();
      };

      const old = document.getElementById("card");
      if (exitDir && old) {
        old.classList.add(exitDir === "left" ? "exit-left" : "exit-right");
        setTimeout(build, 200);
        return;
      }
      build();
    }

    function renderFinish() {
      finished = true;
      controls.hidden = true;
      counter.textContent = `${entries.length} / ${entries.length}`;
      bar.style.width = "100%";
      deck.innerHTML = `
        <div class="finish card enter">
          <h2>다 봤어요 🎉</h2>
          <p>${entries.length}개 표현을 모두 학습했어요.</p>
          <div class="row">
            <button type="button" class="primary" id="restartBtn">처음부터 다시</button>
            <a href="./">다른 날짜 고르기</a>
          </div>
        </div>`;
      document.getElementById("restartBtn").addEventListener("click", () => {
        index = 0;
        stage = 0;
        renderCard({ animate: true });
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /* ---------- actions ---------- */
    function revealNext() {
      if (stage >= REVEAL_ORDER.length) return false;
      stage += 1;
      const target = document.querySelectorAll(".slot")[stage - 1];
      if (target) {
        target.classList.add("revealed");
        target.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
      syncControls();
      return true;
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0) return bounce();
      if (next >= entries.length) return renderFinish();
      index = next;
      stage = 0;
      renderCard({ animate: true, exitDir: delta > 0 ? "left" : "right" });
    }

    function bounce() {
      const card = document.getElementById("card");
      if (card) {
        card.classList.remove("dragging");
        card.style.transform = "";
      }
    }

    primaryBtn.addEventListener("click", () => {
      if (!revealNext()) go(1);
    });
    prevBtn.addEventListener("click", () => go(-1));
    nextBtn.addEventListener("click", () => go(1));

    document.addEventListener("keydown", (e) => {
      if (finished || !entries.length) return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (!revealNext()) go(1);
      } else if (e.key === "ArrowLeft") {
        go(-1);
      } else if (e.key === "ArrowRight") {
        go(1);
      }
    });

    /* ---------- gestures ---------- */
    function bindCard(card) {
      let startX = null, startY = null, axis = null, didSwipe = false;

      card.addEventListener("click", () => {
        if (didSwipe) { didSwipe = false; return; }
        revealNext();
      });

      const down = (x, y) => { startX = x; startY = y; axis = null; didSwipe = false; };

      const move = (x, y, e) => {
        if (startX == null) return;
        const dx = x - startX, dy = y - startY;
        if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
          axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
          if (axis === "x") card.classList.add("dragging");
        }
        if (axis !== "x") return;
        if (e && e.cancelable) e.preventDefault();
        didSwipe = true;
        card.style.transform = `translateX(${dx}px) rotate(${dx * 0.03}deg)`;
      };

      const up = (x) => {
        if (startX == null) return;
        const dx = x - startX;
        const wasX = axis === "x";
        startX = null; axis = null;
        card.classList.remove("dragging");
        if (!wasX) return;
        if (Math.abs(dx) >= 72) {
          try { localStorage.setItem("unknown-swiped", "1"); } catch (e) {}
          swipeTip.hidden = true;
          go(dx < 0 ? 1 : -1);
        } else {
          card.style.transform = "";
        }
      };

      card.addEventListener("touchstart", (e) => down(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      card.addEventListener("touchmove", (e) => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
      card.addEventListener("touchend", (e) => up(e.changedTouches[0].clientX));
      card.addEventListener("touchcancel", () => { startX = null; axis = null; bounce(); });

      card.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch") return;
        down(e.clientX, e.clientY);
        card.setPointerCapture(e.pointerId);
      });
      card.addEventListener("pointermove", (e) => { if (e.pointerType !== "touch") move(e.clientX, e.clientY); });
      card.addEventListener("pointerup", (e) => { if (e.pointerType !== "touch") up(e.clientX); });
    }

    load();
  </script>
</body>
</html>
